# =============================================================================
# nginx 站点配置 · 单页应用 + 静态资源长缓存 + 安全响应头
# 依据：主方案 §9.4 安全清单、AGENTS §2.8
#
# 注意（避免踩坑）：nginx 的 add_header 一旦在某个 location 里出现，
# 该 location 就不会再继承 server 层的 add_header。所以本文件里所有
# location 都不写 add_header，缓存策略统一用 expires 表达。
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不对外泄露 nginx 版本
    server_tokens off;

    # ---------- 安全响应头 ----------
    # 允许同源 iframe 嵌入（家长在学校门户内嵌时可用），其余一律禁止
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # 纯静态应用：脚本只能来自本机；样式允许内联（framer-motion 会写内联样式）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;

    # 限流（zone 定义在 00-limit-zone.conf，该文件同处 http 上下文）
    limit_req zone=perip burst=60 nodelay;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # ---------- 带构建指纹的资源：一年长缓存 ----------
    location /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    # 字体与图标
    location ~* \.(?:png|svg|woff2)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # ---------- Service Worker / manifest / index.html：一律不缓存 ----------
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }

    # ---------- SPA 兜底：任何前端路由都交给 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }

    # 访问口令（可选）：启用后取消注释，并把 .htpasswd 打进镜像（见 Dockerfile）
    # auth_basic "信息学闯关";
    # auth_basic_user_file /etc/nginx/.htpasswd;
}
