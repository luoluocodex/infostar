# =============================================================================
# nginx 限流 zone 定义
# limit_req_zone 只能写在 http 上下文里；本文件被 /etc/nginx/nginx.conf
# 的 `include /etc/nginx/conf.d/*.conf;` 引入，正好处于 http 内，
# 因此可以和 default.conf 一起放在 conf.d/ 下（文件名以 00- 开头，先于 default.conf 加载）。
# =============================================================================

limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
limit_req_status 429;
